<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mindscape</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">Mind<span>scape</span></div>
    <div class="group">
      <button data-action="new" data-i18n="top.new" data-i18n-title="top.new.tip"></button>
      <button data-action="open" data-i18n="top.open" data-i18n-title="top.open.tip"></button>
      <button data-action="import-image" data-i18n="top.image" data-i18n-title="top.image.tip"></button>
      <button data-action="save-project" data-i18n="top.save" data-i18n-title="top.save.tip"></button>
      <button data-action="export" class="accent" data-i18n="top.export" data-i18n-title="top.export.tip"></button>
    </div>
    <div class="group modes">
      <button data-mode="sketch" class="active" data-i18n="top.sketch" data-i18n-title="top.sketch.tip"></button>
      <button data-mode="edit" data-i18n="top.edit" data-i18n-title="top.edit.tip"></button>
    </div>
    <div class="group">
      <button data-action="undo" data-i18n-title="top.undo.tip">↶</button>
      <button data-action="redo" data-i18n-title="top.redo.tip">↷</button>
    </div>
    <div class="group">
      <button data-action="generate" class="primary" data-i18n="top.generate" data-i18n-title="top.generate.tip"></button>
      <button data-action="reroll-all" data-i18n="top.rerollAll" data-i18n-title="top.rerollAll.tip"></button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button data-action="send-claude" data-i18n-title="top.claude.tip">→ Claude</button>
    </div>
    <div class="group seg" id="lang" data-i18n-title="top.lang.tip">
      <button data-lang="cs">CS</button><button data-lang="en">EN</button>
    </div>
    <div id="status"></div>
  </header>

  <aside id="left">
    <section>
      <h3 data-i18n="left.tools"></h3>
      <div id="tools" class="tools"></div>
      <label class="row"><span data-i18n="left.brush"></span> <input id="brush" type="range" min="1" max="40" value="6" /><span id="brush-val">6</span></label>
      <div class="row seg" id="fixed-toggle" data-i18n-title="left.fixed.tip">
        <button data-fixed="0" class="active" data-i18n="left.relative"></button><button data-fixed="1" data-i18n="left.fixed"></button>
      </div>
      <label class="row"><span data-i18n="left.shape"></span>
        <select id="brush-shape"><option value="circle" data-i18n="left.circle"></option><option value="square" data-i18n="left.square"></option></select>
      </label>
      <label class="row"><span data-i18n="left.symmetry"></span>
        <select id="symmetry">
          <option value="none" data-i18n="sym.none"></option>
          <option value="x" data-i18n="sym.x"></option>
          <option value="y" data-i18n="sym.y"></option>
          <option value="xy" data-i18n="sym.xy"></option>
          <option value="rot2" data-i18n="sym.rot2"></option>
        </select>
      </label>
    </section>
    <section id="palette-section">
      <h3 id="palette-title"></h3>
      <input id="block-search" type="search" data-i18n-ph="left.search" hidden />
      <div id="block-tabs" class="tabs" hidden></div>
      <div id="palette" class="palette"></div>
    </section>
    <section id="hint" class="hint"></section>
  </aside>

  <main id="viewport">
    <canvas id="canvas"></canvas>
    <div id="cursor-info"></div>
    <div id="toast" hidden></div>
    <div id="busy" hidden><div class="spinner"></div></div>
  </main>

  <aside id="right">
    <section>
      <h3 data-i18n="right.map"></h3>
      <label class="row"><span data-i18n="right.name"></span> <input id="map-name" type="text" /></label>
      <label class="row"><span data-i18n="right.author"></span> <input id="map-author" type="text" /></label>
      <label class="row"><span data-i18n="right.desc"></span> <input id="map-desc" type="text" /></label>
      <label class="row"><span data-i18n="right.base"></span> <select id="base-biome" class="biome-select"></select></label>
      <div class="row"><span class="small grow" id="map-size"></span><button data-action="resize" class="mini" data-i18n="right.resize"></button></div>
      <div class="row">
        <button data-action="flip-x" class="mini" data-i18n-title="right.flipX.tip">⇋ <span data-i18n="right.flip"></span></button>
        <button data-action="flip-y" class="mini" data-i18n-title="right.flipY.tip">⇵ <span data-i18n="right.flip"></span></button>
      </div>
    </section>
    <section>
      <h3 data-i18n="right.generator"></h3>
      <label class="row"><span data-i18n="right.seed"></span> <input id="seed" type="number" /><button data-action="reroll-all" class="mini">🎲</button></label>
      <div class="rerolls">
        <button data-reroll="shape" data-i18n="reroll.shape" data-i18n-title="reroll.shape.tip"></button>
        <button data-reroll="floor" data-i18n="reroll.floor" data-i18n-title="reroll.floor.tip"></button>
        <button data-reroll="rocks" data-i18n="reroll.rocks" data-i18n-title="reroll.rocks.tip"></button>
        <button data-reroll="ores" data-i18n="reroll.ores" data-i18n-title="reroll.ores.tip"></button>
        <button data-reroll="deco" data-i18n="reroll.deco" data-i18n-title="reroll.deco.tip"></button>
      </div>
      <div id="params"></div>
      <label class="row check"><input id="auto-gen" type="checkbox" checked /> <span data-i18n="right.autoGen"></span></label>
    </section>
    <section>
      <h3 data-i18n="right.view"></h3>
      <label class="row"><span data-i18n="right.sketchOpacity"></span> <input id="sketch-opacity" type="range" min="0" max="100" value="0" /></label>
      <label class="row"><span data-i18n="right.bgOpacity"></span> <input id="bg-opacity" type="range" min="0" max="100" value="40" /></label>
      <label class="row check"><input id="show-locks" type="checkbox" checked /> <span data-i18n="right.showLocks"></span></label>
      <label class="row check"><input id="show-grid" type="checkbox" /> <span data-i18n="right.grid"></span></label>
      <div class="row">
        <button data-action="lock-all" class="mini" data-i18n="right.lockAll"></button>
        <button data-action="unlock-all" class="mini" data-i18n="right.unlockAll"></button>
      </div>
      <div class="row">
        <button data-action="beautify" class="mini" data-i18n="right.beautify" data-i18n-title="right.beautify.tip"></button>
      </div>
    </section>
  </aside>

  <dialog id="new-dialog">
    <form method="dialog">
      <h3 data-i18n="dlg.new.title"></h3>
      <label class="row"><span data-i18n="dlg.width"></span> <input name="w" type="number" value="200" min="50" max="1000" /></label>
      <label class="row"><span data-i18n="dlg.height"></span> <input name="h" type="number" value="200" min="50" max="1000" /></label>
      <label class="row"><span data-i18n="right.base"></span> <select name="base" class="biome-select"></select></label>
      <label class="row check"><input name="island" type="checkbox" checked /> <span data-i18n="dlg.new.island"></span></label>
      <menu><button value="cancel" data-i18n="dlg.cancel"></button><button value="ok" class="primary" data-i18n="dlg.new.ok"></button></menu>
    </form>
  </dialog>
  <dialog id="resize-dialog">
    <form method="dialog">
      <h3 data-i18n="dlg.resize.title"></h3>
      <label class="row"><span data-i18n="dlg.width"></span> <input name="w" type="number" min="20" max="2000" /></label>
      <label class="row"><span data-i18n="dlg.height"></span> <input name="h" type="number" min="20" max="2000" /></label>
      <label class="row"><span data-i18n="dlg.resize.h"></span>
        <select name="ax"><option value="center" data-i18n="dlg.resize.center"></option><option value="left" data-i18n="dlg.resize.left"></option><option value="right" data-i18n="dlg.resize.right"></option></select>
      </label>
      <label class="row"><span data-i18n="dlg.resize.v"></span>
        <select name="ay"><option value="center" data-i18n="dlg.resize.center"></option><option value="bottom" data-i18n="dlg.resize.bottom"></option><option value="top" data-i18n="dlg.resize.top"></option></select>
      </label>
      <p class="small" data-i18n="dlg.resize.note"></p>
      <menu><button value="cancel" data-i18n="dlg.cancel"></button><button value="ok" class="primary" data-i18n="dlg.resize.ok"></button></menu>
    </form>
  </dialog>
  <dialog id="image-dialog">
    <form method="dialog">
      <h3 data-i18n="dlg.image.title"></h3>
      <img id="image-preview" alt="" />
      <label class="row"><span data-i18n="dlg.width"></span> <input name="w" type="number" min="20" max="2000" value="200" /></label>
      <label class="row"><span data-i18n="dlg.height"></span> <input name="h" type="number" min="20" max="2000" /></label>
      <label class="row check"><input name="aspect" type="checkbox" checked /> <span data-i18n="dlg.image.aspect"></span></label>
      <label class="row check"><input name="walls" type="checkbox" checked /> <span data-i18n="dlg.image.walls"></span></label>
      <label class="row check"><input name="fixedWalls" type="checkbox" /> <span data-i18n="dlg.image.fixed"></span></label>
      <label class="row"><span data-i18n="dlg.image.close"></span> <input name="close" type="range" min="0" max="8" value="3" /></label>
      <label class="row"><span data-i18n="dlg.image.line"></span> <input name="line" type="range" min="1" max="7" value="3" /></label>
      <label class="row"><span data-i18n="right.base"></span> <select name="base" class="biome-select"></select></label>
      <label class="row check"><input name="replace" type="checkbox" checked /> <span data-i18n="dlg.image.replace"></span></label>
      <menu><button value="cancel" data-i18n="dlg.cancel"></button><button value="ok" class="primary" data-i18n="dlg.image.ok"></button></menu>
    </form>
  </dialog>
  <input id="file-input" type="file" accept=".msav,.json" hidden />
  <input id="image-input" type="file" accept="image/*" hidden />
  <script type="module" src="./main.js"></script>
</body>
</html>
